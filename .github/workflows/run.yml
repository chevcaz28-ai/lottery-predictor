name: Run Lottery Predictor

on:
  schedule:
    - cron: "30 4 * * *"  # Runs every day at 04:30 UTC (≈ 11:30 PM America/Chicago)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas numpy requests scikit-learn openai

      - name: Run script
        env:
          # Required secrets
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}

          # Sheet and timezone settings
          SHEET_NAME:        ${{ vars.SHEET_NAME }}       # e.g. "Lottery Predictor New August 25"
          LOCAL_TZ:          America/Chicago

          # Prediction control
          FORCE_PREDICT_TODAY: ${{ vars.FORCE_PREDICT_TODAY }}
          ENABLE_PREDICTIONS: "1"
          PREDICTIONS_POWERBALL:  ${{ vars.PRED_COUNT_POWERBALL }}
          PREDICTIONS_MEGABUCKS:  ${{ vars.PRED_COUNT_MEGABUCKS }}
          PREDICTIONS_SUPERCASH:  ${{ vars.PRED_COUNT_SUPERCASH }}
          PREDICTIONS_BADGER5:    ${{ vars.PRED_COUNT_BADGER5 }}
          ENABLE_BASELINE:    "0"

          # Optional LLM support
          ENABLE_LLM_METHOD: ${{ vars.ENABLE_LLM_METHOD }}  # set to "1" or "0"
          OPENAI_MODEL:      ${{ vars.OPENAI_MODEL }}       # e.g., gpt-4o-mini
        run: |
          # Upgrade OpenAI client if LLM method is enabled
          pip install --upgrade openai
          python main.py
