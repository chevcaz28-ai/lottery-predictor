name: Lottery Automation

on:
  schedule:
    - cron: "0 8 * * *"   # runs daily at 08:00 UTC (02:00/03:00 Central depending on DST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lottery-automation
  cancel-in-progress: false

jobs:
  run-lottery:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests openai

      # Optional: echo non-secret config so you can confirm your targets
      - name: Echo config
        run: |
          echo "SHEET_NAME=${{ vars.SHEET_NAME }}"
          echo "PREDICTIONS_POWERBALL=${{ vars.PREDICTIONS_POWERBALL }}"
          echo "PREDICTIONS_MEGABUCKS=${{ vars.PREDICTIONS_MEGABUCKS }}"
          echo "PREDICTIONS_SUPERCASH=${{ vars.PREDICTIONS_SUPERCASH }}"
          echo "PREDICTIONS_BADGER5=${{ vars.PREDICTIONS_BADGER5 }}"
          echo "PREDICTIONS_PER_GAME=${{ vars.PREDICTIONS_PER_GAME }}"
          echo "ENABLE_LLM_METHOD=${{ vars.ENABLE_LLM_METHOD }}"
          echo "OPENAI_MODEL=${{ vars.OPENAI_MODEL }}"
          echo "FORCE_PREDICT_TODAY=${{ vars.FORCE_PREDICT_TODAY }}"

      - name: Run script
        env:
          # Required secrets
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}
          # Optional: for LLM predictions (only used if ENABLE_LLM_METHOD=1)
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}

          # Optional sheet override
          SHEET_NAME:        ${{ vars.SHEET_NAME }}

          # Core controls
          ENABLE_PREDICTIONS: "1"
          ENABLE_BASELINE: "0"           # "0" to hide baseline, "1" to include it

          # Per-game totals (repo "Variables")
          PREDICTIONS_POWERBALL:  ${{ vars.PREDICTIONS_POWERBALL }}
          PREDICTIONS_MEGABUCKS:  ${{ vars.PREDICTIONS_MEGABUCKS }}
          PREDICTIONS_SUPERCASH:  ${{ vars.PREDICTIONS_SUPERCASH }}
          PREDICTIONS_BADGER5:    ${{ vars.PREDICTIONS_BADGER5 }}
          # Fallback global default if any of the above are missing
          PREDICTIONS_PER_GAME:   ${{ vars.PREDICTIONS_PER_GAME }}

          # LLM method toggle/model
          ENABLE_LLM_METHOD:  ${{ vars.ENABLE_LLM_METHOD }}   # "1" or "0"
          OPENAI_MODEL:       ${{ vars.OPENAI_MODEL }}        # e.g., gpt-4o-mini

          # Manual forcing of predictions (for ad-hoc tests / pre-draw runs)
          FORCE_PREDICT_TODAY: ${{ vars.FORCE_PREDICT_TODAY }}  # "0" normally; set "1" to force
        run: |
          python -u main.py
