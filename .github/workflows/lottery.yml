name: Lottery Automation

on:
  schedule:
    - cron: "0 8 * * *"  # Runs daily at 8 AM UTC
  workflow_dispatch:

jobs:
  run-lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests gspread google-auth scikit-learn

      - name: Run script
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          # If your sheet name is different, uncomment & change the next line:
          # SHEET_NAME: "Your Exact Sheet Name"
        run: python main.py
