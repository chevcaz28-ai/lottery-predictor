name: Lottery Automation

on:
  schedule:
    # NOTE: GitHub Actions cron runs in **UTC**.
    # 13:00 UTC ≈ 08:00 America/Chicago during Daylight Saving (CDT).
    # Adjust if you want a different local time.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests gspread google-auth openai

      # ---- Preflight: ensure required secrets are present ----
      - name: Preflight env check
        run: |
          set -e
          req=(GOOGLE_CREDS_JSON RAPID_API_KEY)
          if [[ "${ENABLE_LLM_METHOD:-0}" == "1" ]]; then
            req+=(OPENAI_API_KEY)
          fi

          fail=0
          for v in "${req[@]}"; do
            if [[ -z "${!v}" ]]; then
              echo "::error title=Missing secret::${v} is missing"; fail=1
            else
              echo "${v} is set"
            fi
          done

          if [[ $fail -ne 0 ]]; then
            echo "Preflight failed due to missing secrets."
            exit 1
          fi
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ENABLE_LLM_METHOD: ${{ vars.ENABLE_LLM_METHOD }}

      - name: Run script
        env:
          # ---- Required secrets ----
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}

          # ---- Sheet & timezone ----
          SHEET_NAME:        ${{ vars.SHEET_NAME }}       # e.g. "Lottery Predictor New August 25"
          LOCAL_TZ:          America/Chicago              # script will read this if supported

          # ---- Core controls ----
          ENABLE_PREDICTIONS: "1"

          # ---- Per-game totals (use repo Variables) ----
          # These names match what your script logs showed (PRED_COUNT_*).
          PRED_COUNT_POWERBALL:  ${{ vars.PRED_COUNT_POWERBALL }}
          PRED_COUNT_MEGABUCKS:  ${{ vars.PRED_COUNT_MEGABUCKS }}
          PRED_COUNT_SUPERCASH:  ${{ vars.PRED_COUNT_SUPERCASH }}
          PRED_COUNT_BADGER5:    ${{ vars.PRED_COUNT_BADGER5 }}

          # ---- Optional LLM method ----
          ENABLE_LLM_METHOD: ${{ vars.ENABLE_LLM_METHOD }}   # "1" to enable, "0" to disable
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}    # only needed if ENABLE_LLM_METHOD="1"
          OPENAI_MODEL:      ${{ vars.OPENAI_MODEL }}         # e.g., gpt-4o-mini

        run: python main.py
