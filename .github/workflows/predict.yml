name: Lottery Predictor Auto Run
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests gspread google-auth
      - name: Run predictions
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}  # <-- add this
          SHEET_NAME: Lottery Predictor New August 25
          ENABLE_PREDICTIONS: "1"
          FORCE_PREDICT_TODAY: ${{ vars.FORCE_PREDICT_TODAY }}
          PREDICTIONS_POWERBALL:  ${{ vars.PRED_COUNT_POWERBALL }}
          PREDICTIONS_MEGABUCKS:  ${{ vars.PRED_COUNT_MEGABUCKS }}
          PREDICTIONS_SUPERCASH:  ${{ vars.PRED_COUNT_SUPERCASH }}
          PREDICTIONS_BADGER5:    ${{ vars.PRED_COUNT_BADGER5 }}
          ENABLE_BASELINE:   "0"
        run: python main.py
