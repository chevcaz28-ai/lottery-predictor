name: Lottery Predictor Auto Run
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests gspread google-auth
      - name: Run predictions
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_NAME: Lottery Predictor New August 25
          ENABLE_PREDICTIONS: "1"
          PRED_COUNT_POWERBALL: "20"
          PRED_COUNT_MEGABUCKS: "20"
          PRED_COUNT_SUPERCASH: "20"
          PRED_COUNT_BADGER5: "20"
        run: python main.py
