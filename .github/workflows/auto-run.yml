name: Lottery Predictor Auto Run

on:
  schedule:
    - cron: "30 4 * * *"  # 04:30 UTC ≈ 11:30 PM US Central
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas numpy requests scikit-learn

      - name: Run script
      env:
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
        run: python main.py
          python - << 'PY'
import os, sys, traceback
print("RAPID_API_KEY present:", bool(os.getenv("RAPID_API_KEY")))
print("GOOGLE_CREDS_JSON length:", len(os.getenv("GOOGLE_CREDS_JSON","")))
try:
    import main
    print("✅ main.py executed")
except Exception as e:
    traceback.print_exc()
    sys.exit(1)
PY
