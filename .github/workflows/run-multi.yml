name: Run Multi-Game Predictor

on:
  workflow_dispatch: {}
  # (Optional) also run on a schedule; 14:00 UTC ≈ 9:00 AM Chicago when not in DST
  # schedule:
  #   - cron: "0 14 * * *"

jobs:
  run-multi:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install gspread google-auth pandas numpy requests scikit-learn pytz
          fi

      - name: Run multi-game script
        env:
          # Use the SAME Google service-account JSON you already use elsewhere
          # If you already created a secret named GOOGLE_CREDS_JSON, you can reuse it:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          # Or, if you prefer to create a secret named GCP_SERVICE_ACCOUNT_JSON, swap to:
          # GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

          # Sheet ID can be a repo Variable or Secret; use whichever you have set:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID }}
          # If you used a secret instead of a var, use:
          # GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          # Runtime knobs (safe defaults; change if you want)
          LOCAL_TZ: America/Chicago
          GAMES_LIST: "Badger 5,Super Cash,Megabucks,Powerball"
          PREDICTIONS_PER_RUN: "20"
          METHODS: "baseline,decay,dirichlet,order2_backoff"
          DECAY_HALF_LIFE_DRAWS: "365"
          DIRICHLET_ALPHA: "1.0"
          BACKOFF_LAMBDA: "0.6"
          LAPLACE_ALPHA: "0.5"
          SOFTMAX_TAU: "1.0"
          NO_CONSEC_LIMIT: "3"
        run: |
          python multi_game_main.py
