name: predict

on:
  workflow_dispatch:
    inputs:
      force_predict_today:
        description: "Force running predictions (even if already ran today)"
        required: false
        default: "1"
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC ~= 22:15 America/Chicago (adjust as desired)

jobs:
  predict:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      SHEET_NAME: Lottery Predictor New August 25
      LOCAL_TZ: America/Chicago

      # Secrets (set these in GitHub repo -> Settings -> Secrets and variables -> Actions)
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Core toggles
      ENABLE_PREDICTIONS: "1"
      ENABLE_BASELINE: "0"
      ENABLE_LLM_METHOD: "1"

      # LLM (main.py expects OPENAI_MODEL)
      OPENAI_MODEL: gpt-4o-mini
      LLM_TEMP: "0.9"   # main.py reads LLM_TEMP only if implemented; safe to keep

      # Markov tuning (main.py reads these)
      MARKOV_TEMP: "1.2"
      MARKOV_SMOOTH: "1.0"
      MARKOV_RANDOM_SEED: "123"

      # Method weighting (SAFE / OFF by default)
      # Kill switch: set ENABLE_METHOD_WEIGHTING to "0" to disable immediately
      ENABLE_METHOD_WEIGHTING: "0"
      METHOD_WEIGHTING_LOOKBACK_ROWS: "400"     # how many tracker rows (per game) to consider
      METHOD_WEIGHTING_MIN_ROWS: "40"           # minimum evaluated rows required to enable weighting
      METHOD_WEIGHTING_BLEND_ALPHA: "0.35"      # 0=uniform, 1=fully learned (recommend <=0.5)
      METHOD_WEIGHTING_CAP_RATIO: "2.0"         # prevents one method dominating
      METHOD_WEIGHTING_WIN_BONUS: "5.0"         # adds extra weight for wins (usually 0)


      # Prediction counts
      PREDICTIONS_PER_GAME: "10"
      PREDICTIONS_POWERBALL: "5"
      PREDICTIONS_MEGABUCKS: "10"
      PREDICTIONS_SUPERCASH: "10"
      PREDICTIONS_BADGER5: "5"

      # Backtest (main.py reads these)
      RUN_BACKTEST: "1"
      WRITE_BACKTEST: "1"

      # Optional: gspread write retry backoff used by your code
      GSPREAD_BACKOFF_MAX_SEC: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif ls requirements*.txt >/dev/null 2>&1; then
            pip install -r "$(ls requirements*.txt | head -n1)"
          else
            pip install               "requests>=2.31.0"               "pandas>=2.2.2"               "numpy>=1.26.4"               "pytz>=2024.1"               "gspread>=6.1.2"               "google-auth>=2.34.0"               "scikit-learn>=1.5.1"               "openai>=1.40.0"
          fi

      - name: Preflight env
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          req_env=(GOOGLE_CREDS_JSON RAPID_API_KEY SHEET_NAME LOCAL_TZ)
          for v in "${req_env[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required env/var: $v"
              missing=1
            fi
          done

          # Validate GOOGLE_CREDS_JSON is valid JSON
          if ! echo "$GOOGLE_CREDS_JSON" | python -c "import json,sys; json.load(sys.stdin)"; then
            echo "::error::GOOGLE_CREDS_JSON is not valid JSON"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Preflight failed; aborting."
            exit 1
          fi
          echo "Preflight OK."

      - name: Compile (sanity)
        run: python -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('.', force=True, quiet=1) else 1)"

      - name: Run predictions
        shell: bash
        env:
          FORCE_PREDICT_TODAY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_predict_today || '0' }}
        run: |
          set -euo pipefail
          echo "Running main.py ..."
          echo "FORCE_PREDICT_TODAY=$FORCE_PREDICT_TODAY"
          echo "PREDICTIONS_PER_GAME=${PREDICTIONS_PER_GAME:-''}"
          echo "Per-game overrides: PB=${PREDICTIONS_POWERBALL:-''}, MB=${PREDICTIONS_MEGABUCKS:-''}, SC=${PREDICTIONS_SUPERCASH:-''}, B5=${PREDICTIONS_BADGER5:-''}"
          python main.py
