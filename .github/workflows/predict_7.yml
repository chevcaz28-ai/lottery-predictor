name: predict

on:
  schedule:
    # Runs daily at 05:15 America/Chicago (11:15 UTC during standard time)
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      force_predict_today:
        description: "Force prediction even if no new draw detected (0/1)"
        required: false
        default: "0"
      run_backtest:
        description: "Run backtest logic if implemented (0/1)"
        required: false
        default: "1"

jobs:
  predict:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      metadata: read

    env:
      # Required
      SHEET_NAME: "Lottery Predictor New August 25"
      LOCAL_TZ: "America/Chicago"
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Optional (recommended if you ever rename the sheet)
      # SHEET_ID: "1AeumsjywQ2pECb34eR0_ms8yH6D9mjb4Gb9bhRQ9NuU"

      # Feature toggles
      ENABLE_PREDICTIONS: "1"
      ENABLE_BASELINE: "1"       # enables non-LLM methods (e.g., markov/frequency/recency) in your main.py
      ENABLE_LLM_METHOD: "1"
      ENABLE_METHOD_WEIGHTING: "0"

      # IMPORTANT: hide the "already-drawn" baseline from output.
      # This is the method that simply repeats the last draw (useful only for diagnostics).
      DISABLE_METHODS: "last_draw_baseline"

      # Prediction counts
      PREDICTIONS_PER_GAME: "10"
      PREDICTIONS_POWERBALL: "5"
      PREDICTIONS_MEGABUCKS: "10"
      PREDICTIONS_SUPERCASH: "10"
      PREDICTIONS_BADGER5: "5"

      # Method knobs (keep as you had them)
      OPENAI_MODEL: "gpt-4o-mini"
      LLM_TEMP: "0.9"
      MARKOV_TEMP: "1.2"
      MARKOV_SMOOTH: "1.0"
      MARKOV_RANDOM_SEED: "123"

      # Backtest (will be skipped gracefully if not implemented)
      RUN_BACKTEST: ${{ github.event.inputs.run_backtest || '1' }}
      WRITE_BACKTEST: "1"

      # Gspread backoff
      GSPREAD_BACKOFF_MAX_SEC: "20"

      # Dispatch input (schedule defaults to 0)
      FORCE_PREDICT_TODAY: ${{ github.event.inputs.force_predict_today || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif ls requirements*.txt >/dev/null 2>&1; then
            pip install -r "$(ls requirements*.txt | head -n1)"
          else
            pip install               "requests>=2.31.0"               "pandas>=2.2.2"               "numpy>=1.26.4"               "pytz>=2024.1"               "gspread>=6.1.2"               "google-auth>=2.34.0"               "scikit-learn>=1.5.1"               "openai>=1.40.0"
          fi

      - name: Preflight (required env + GOOGLE_CREDS_JSON validity)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          req_env=(GOOGLE_CREDS_JSON RAPID_API_KEY SHEET_NAME LOCAL_TZ)
          for v in "${req_env[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required env/var: $v"
              missing=1
            fi
          done

          # Validate GOOGLE_CREDS_JSON is valid JSON
          if ! echo "$GOOGLE_CREDS_JSON" | python -c "import json,sys; json.load(sys.stdin)"; then
            echo "::error::GOOGLE_CREDS_JSON is not valid JSON"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Preflight failed; aborting."
            exit 1
          fi
          echo "Preflight OK."

      - name: Compile Python
        shell: bash
        run: |
          python -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('.', force=True, quiet=1) else 1)"

      - name: Run predictor
        shell: bash
        run: |
          set -euo pipefail
          echo "Running main.py ..."
          echo "FORCE_PREDICT_TODAY=$FORCE_PREDICT_TODAY"
          echo "PREDICTIONS_PER_GAME=${PREDICTIONS_PER_GAME:-''}"
          echo "Per-game overrides: PB=${PREDICTIONS_POWERBALL:-''}, MB=${PREDICTIONS_MEGABUCKS:-''}, SC=${PREDICTIONS_SUPERCASH:-''}, B5=${PREDICTIONS_BADGER5:-''}"
          echo "DISABLE_METHODS=${DISABLE_METHODS:-''}"
          python main.py
