name: Run Lottery Predictor

on:
  workflow_dispatch:
  schedule:
    - cron: "10 3 * * *"   # runs daily at 03:10 UTC

jobs:
  run-script:
    runs-on: ubuntu-24.04

    env:
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      RAPID_API_KEY:     ${{ secrets.RAPID_API_KEY }}
      SHEET_NAME: "Lottery Predictor New August 25"
      LOCAL_TZ: "America/Chicago"
      ENABLE_MARKOV_METHOD: "1"
      MARKOV_METHOD_NAME: "markov"
      MARKOV_TEMP: "0.7"
      MARKOV_SMOOTH: "1.0"
      # ✅ Set how many predictions per game (edit numbers as needed)
      MARKOV_TARGETS_JSON: '{"SuperCash": 12, "Badger 5": 6, "Megabucks": 8}'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests gspread google-auth openai

      - name: Write Google creds to file
        run: |
          printf '%s' "$GOOGLE_CREDS_JSON" > creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/creds.json" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          set -euo pipefail
          req=(GOOGLE_CREDS_JSON RAPID_API_KEY)
          if [[ "${ENABLE_LLM_METHOD:-0}" == "1" ]]; then
            req+=(OPENAI_API_KEY)
          fi
          fail=0
          for v in "${req[@]}"; do
            val="${!v:-}"
            if [[ -z "$val" ]]; then
              echo "::error title=Missing secret::$v is missing"; fail=1
            else
              echo "$v is set"
            fi
          done
          if [[ $fail -ne 0 ]]; then
            echo "Preflight failed due to missing secrets."
            exit 1
          fi

      - name: Diagnostic – show Markov targets
        run: |
          python - <<'PY'
          import os, json
          raw = os.getenv("MARKOV_TARGETS_JSON","")
          try:
              targets = json.loads(raw) if raw.strip() else {}
          except Exception:
              targets = {}
          print("Resolved MARKOV targets:", targets)
          PY

      - name: Run main predictor
        run: python main.py

      - name: Run Markov predictor
        run: python markov_predictor.py
