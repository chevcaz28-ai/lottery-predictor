name: Predictions (main then markov)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force predictions even if no new results? (true/false)"
        required: false
        default: "false"
      predictions_per_game:
        description: "Override PREDICTIONS_PER_GAME (leave blank to use repo var)"
        required: false
        default: ""
  schedule:
    # 08:05 UTC = 03:05 America/Chicago during Daylight Saving Time (CDT).
    # Adjust this to the nightly time you prefer in Chicago time, converting to UTC.
    - cron: "5 8 * * *"

concurrency:
  group: predictions-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ---- Required repository VARIABLES (Settings → Variables → Actions) ----
      SHEET_NAME: ${{ vars.SHEET_NAME }}
      LOCAL_TZ: ${{ vars.LOCAL_TZ }}

      # Prediction counts (either per-game vars OR global default). Prefer input when provided.
      PREDICTIONS_PER_GAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.predictions_per_game != '') && inputs.predictions_per_game || vars.PREDICTIONS_PER_GAME }}
      PREDICTIONS_POWERBALL: ${{ vars.PREDICTIONS_POWERBALL }}
      PREDICTIONS_MEGABUCKS: ${{ vars.PREDICTIONS_MEGABUCKS }}
      PREDICTIONS_SUPERCASH: ${{ vars.PREDICTIONS_SUPERCASH }}
      PREDICTIONS_BADGER5: ${{ vars.PREDICTIONS_BADGER5 }}

      # ---- Required repository SECRETS ----
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # ---- Markov tuning (override in repo Variables if you want) ----
      MARKOV_METHOD_NAME: ${{ vars.MARKOV_METHOD_NAME || 'markov' }}
      MARKOV_TEMP: ${{ vars.MARKOV_TEMP || '0.7' }}
      MARKOV_SMOOTH: ${{ vars.MARKOV_SMOOTH || '1.0' }}
      # Example: {"SuperCash":10,"Badger 5":5}
      MARKOV_TARGETS_JSON: ${{ vars.MARKOV_TARGETS_JSON || '{"SuperCash":10,"Badger 5":5}' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif ls requirements*.txt >/dev/null 2>&1; then
            pip install -r "$(ls requirements*.txt | head -n1)"
          else
            # Fallback: install the known deps directly
            pip install               requests>=2.31.0               pandas>=2.2.2               numpy>=1.26.4               pytz>=2024.1               gspread>=6.1.2               google-auth>=2.34.0               scikit-learn>=1.5.1
          fi

      - name: Preflight checks (secrets & vars via jq)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          req_env=(GOOGLE_CREDS_JSON RAPID_API_KEY SHEET_NAME LOCAL_TZ)
          for v in "${req_env[@]}"; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required env/var: $v"
              missing=1
            fi
          done
          if ! echo "$GOOGLE_CREDS_JSON" | jq empty >/dev/null 2>&1; then
            echo "::error::GOOGLE_CREDS_JSON is not valid JSON"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Preflight failed; aborting."
            exit 1
          fi
          echo "Preflight OK."

      - name: Compile check
        run: |
          python -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('.', force=True, quiet=1) else 1)"

      - name: Run main predictions
        env:
          ENABLE_PREDICTIONS: "1"
          ENABLE_BASELINE: "0"
          ENABLE_LLM_METHOD: ${{ vars.ENABLE_LLM_METHOD || '0' }}
          # Force only on manual runs when input force=true|1; otherwise 0
          FORCE_PREDICT_TODAY: ${{ (github.event_name == 'workflow_dispatch' && (inputs.force == 'true' || inputs.force == '1')) && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "Running main.py ..."
          echo "FORCE_PREDICT_TODAY=$FORCE_PREDICT_TODAY"
          echo "PREDICTIONS_PER_GAME=${PREDICTIONS_PER_GAME:-''}"
          echo "Per-game overrides: PB=${PREDICTIONS_POWERBALL:-''}, MB=${PREDICTIONS_MEGABUCKS:-''}, SC=${PREDICTIONS_SUPERCASH:-''}, B5=${PREDICTIONS_BADGER5:-''}"
          python main.py

      - name: Run Markov predictions
        if: ${{ success() }}
        env:
          ENABLE_MARKOV_METHOD: "1"
        run: |
          set -euo pipefail
          echo "Running markov_predictor.py ..."
          echo "MARKOV_TARGETS_JSON=$MARKOV_TARGETS_JSON"
          python markov_predictor.py
