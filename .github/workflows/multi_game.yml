name: Multi-game Runner

on:
  # Nightly schedule (adjust as needed). 01:30 UTC = 8:30 PM previous day CT.
  schedule:
    - cron: "30 1 * * *"
  # Enables the "Run workflow" button in GitHub Actions
  workflow_dispatch:
    inputs:
      games_list:
        description: Comma-separated list of games (overrides default)
        required: false
      predictions_per_run:
        description: Predictions per game (overrides default)
        required: false
      methods:
        description: Methods (comma-separated, overrides default)
        required: false

env:
  LOCAL_TZ: America/Chicago
  # Defaults (can be overridden via workflow_dispatch inputs)
  GAMES_LIST: "Badger 5,Super Cash,Megabucks,Powerball"
  PREDICTIONS_PER_RUN: "20"
  METHODS: "baseline,decay,dirichlet,order2_backoff"
  DECAY_HALF_LIFE_DRAWS: "365"
  DIRICHLET_ALPHA: "1.0"
  BACKOFF_LAMBDA: "0.6"
  LAPLACE_ALPHA: "0.5"
  SOFTMAX_TAU: "1.0"
  NO_CONSEC_LIMIT: "3"

jobs:
  run-multi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Optional cache to speed up installs
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Allow manual overrides from the "Run workflow" UI
      - name: Apply workflow inputs (optional overrides)
        run: |
          if [ -n "${{ github.event.inputs.games_list }}" ]; then
            echo "GAMES_LIST=${{ github.event.inputs.games_list }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.inputs.predictions_per_run }}" ]; then
            echo "PREDICTIONS_PER_RUN=${{ github.event.inputs.predictions_per_run }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ github.event.inputs.methods }}" ]; then
            echo "METHODS=${{ github.event.inputs.methods }}" >> $GITHUB_ENV
          fi

      # Service account JSON for Google Sheets access (must be set in repo Secrets)
      - name: Decode GCP service account (for Google Sheets)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Verify required imports (fail early if something's missing)
        run: |
          python - <<'PY'
          import sys
          mods = ["pytz","pandas","numpy","requests","gspread","google.auth","sklearn"]
          missing = []
          for m in mods:
            try:
              __import__(m)
            except Exception as e:
              missing.append(f"{m}: {e}")
          if missing:
            print("Missing/failed imports:\n" + "\n".join(missing))
            sys.exit(1)
          print("All required imports OK")
          PY

      - name: Run multi_game_main.py
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
        run: |
          python multi_game_main.py
